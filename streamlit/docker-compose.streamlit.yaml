services:
  
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app/streamlit_app
    working_dir: /app
    tty: true
    stdin_open: true
    networks:
      - comores_meteo

networks:
  comores_meteo :
    external: true
